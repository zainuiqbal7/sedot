[package]
name = "sedot-core"
description = "Mesin Sedot: aria2, penghubung ekstensi, penyimpanan, video. Tanpa ketergantungan ke Tauri."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tiny_http = "0.12"
url = "2"
percent-encoding = "2"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
