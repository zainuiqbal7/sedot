# Sedot versi Rust (Tauri). Versi Electron (src/, package.json) tetap ada sampai versi ini setara.
[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"

[profile.release]
# Ukuran & RAM kecil
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
