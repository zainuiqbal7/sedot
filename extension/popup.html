<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.4 "Segoe UI", system-ui, sans-serif; margin: 0; padding: 14px; width: 260px; color: #1c2128; }
    h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    h1 img { width: 20px; height: 20px; }
    .status { padding: 8px 10px; border-radius: 6px; background: #f1f3f5; margin-bottom: 10px; }
    .status.on { background: #e6f3f1; color: #0f766e; }
    .status.off { background: #fff4e5; color: #8a4b00; }
    label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
    p { color: #69717d; font-size: 12px; margin: 10px 0 0; }
    label.gap { margin-top: 6px; }
    .video-btn { margin-top: 10px; width: 100%; padding: 7px 10px; border: 0; border-radius: 6px; background: #0f766e; color: #fff; font: inherit; cursor: pointer; }
    .video-btn:hover { background: #0b5f58; }
    .hint { color: #8a4b00; }
  </style>
</head>
<body>
  <h1><img src="icons/32.png" alt=""> Sedot</h1>
  <div id="status" class="status">Memeriksa aplikasi…</div>
  <label><input type="checkbox" id="capture"> Tangkap unduhan otomatis</label>
  <label class="gap"><input type="checkbox" id="skipSmall"> Biarkan file kecil (&lt; 256 KB) diunduh browser</label>
  <button id="videoBtn" class="video-btn" hidden>Unduh video di tab ini</button>
  <p>Klik kanan link → <b>Unduh dengan Sedot</b> untuk mengirim satu link secara manual.</p>
  <script src="popup.js"></script>
</body>
</html>
