# Setiap kali tag versi (mis. v0.3.1) di-push, GitHub membangun installer di Windows
# dan menerbitkannya di Releases. Aplikasi Sedot yang terpasang akan mengambilnya otomatis.
name: Rilis

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y aria2
      - run: npm ci
      - run: npm test
      - name: Uji menyeluruh (aplikasi sungguhan, tanpa layar)
        run: xvfb-run -a npm run test:e2e

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci # juga mengunduh aria2c.exe resmi + cek SHA-256
      - name: Siapkan tag & rilis draft
        # Rilis dibuat SEKALI di sini (sebagai draft). Tanpa langkah ini electron-builder
        # mengunggah beberapa file bersamaan dan masing-masing bisa membuat rilis sendiri (dobel).
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          git fetch --tags --quiet
          if (-not (git tag -l "v$v")) {
            git tag "v$v"
            git push origin "v$v"
          }
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = "release-notes/v$v.md"
            if (Test-Path $notes) { gh release create "v$v" --draft --title "Sedot $v" --notes-file $notes }
            else { gh release create "v$v" --draft --title "Sedot $v" --generate-notes }
          }
          exit 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bangun installer & unggah ke rilis draft
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lampirkan ekstensi browser ke rilis yang sama
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path extension\* -DestinationPath sedot-extension.zip
          gh release upload "v$v" sedot-extension.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Terbitkan rilis (aplikasi yang terpasang mulai melihat update)
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          gh release edit "v$v" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
