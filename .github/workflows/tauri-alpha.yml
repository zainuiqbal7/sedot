# Installer ALPHA versi Rust/Tauri untuk Windows, untuk dicoba (tidak diterbitkan sebagai update).
# Jalankan dari tab Actions -> "Tauri alpha" -> Run workflow. Hasilnya ada di bagian Artifacts.
name: Tauri alpha

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci # juga mengunduh aria2c.exe resmi + cek SHA-256 ke bin/
      - name: Uji unit (Windows)
        run: cargo test -p sedot-core --lib; cargo test -p sedot --lib
      - name: Bangun installer
        # Nama, folder data & id terpisah dari Sedot biasa; tanpa autostart (fitur 'alpha')
        run: npx tauri build --features alpha --config src-tauri/tauri.alpha.conf.json
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: Sedot-Tauri-alpha-setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
